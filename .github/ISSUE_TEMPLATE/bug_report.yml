name: Bug report
description: The card or the Gist Action shows something wrong
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Card URL or workflow file
      description: The `/api/card?...` URL you use, or the path to your workflow
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Action logs (if the Gist Action failed)
      render: text
